name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "标签 $GITHUB_REF_NAME 与 package.json 版本 $expected 不一致" >&2
            exit 1
          fi

      - name: Upgrade npm (trusted publishing support)
        run: npm install -g npm@11.21.1

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Build release assets
        run: |
          npm pack
          sha256sum ./*.tgz > SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Xander ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ./*.tgz
            SHA256SUMS.txt
